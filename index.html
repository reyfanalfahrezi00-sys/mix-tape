<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songs for You</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Google Hand-written & Modern Serif -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- SCREEN 1: ENVELOPE -->
  <section id="screen-envelope" class="screen active">
    <div class="envelope-wrapper" id="envelope-btn">
      <img src="assets/envelope.png" alt="Envelope" class="envelope-img">
    </div>
  </section>

  <!-- SCREEN 2: FLOWER ANIMATION -->
  <section id="screen-flowers" class="screen">
    <div class="flower-bg"></div>
  </section>

  <!-- SCREEN 3: MAIN MIXTAPE PAGE -->
  <section id="screen-main" class="screen">
    <div class="main-container">
      
      <!-- FLOATING YOUTUBE BUBBLE (LEFT SIDEBAR) -->
      <div id="yt-bubble" class="yt-bubble hidden">
        <button id="close-yt-btn" class="close-btn">&times;</button>
        <div class="yt-header">
          <span id="yt-now-playing">Now Playing Video</span>
        </div>
        <div class="iframe-container">
          <iframe id="yt-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <!-- MAIN CARD TAPE -->
      <div class="mixtape-card">
        <div class="card-header">
          <p class="subtitle">FOR YOU · FROM ME</p>
          <h1 class="title">Songs for you</h1>
        </div>

        <!-- CASSETTE DISPLAY -->
        <div class="cassette-container">
          <div class="cassette-body">
            <img src="assets/cassette.png" alt="Cassette Tape" class="cassette-img">
            <div class="wheels">
              <div class="wheel wheel-left"></div>
              <div class="wheel wheel-right"></div>
            </div>
          </div>
        </div>

        <!-- LOWER SECTION: PLAYLIST & NOTE -->
        <div class="card-bottom">
          <!-- PLAYLIST -->
          <div class="playlist">
            <div class="track-item" data-audio="assets/you.mp3" data-yt="HEAn4FqXFY4" data-title="You - LANY">
              <div class="track-info">
                <span class="track-num">01</span>
                <span class="track-title">You</span>
                <span class="track-artist">LANY</span>
              </div>
              <button class="play-btn">▶</button>
            </div>

            <div class="track-item" data-audio="assets/perfect.mp3" data-yt="2Vv-BfVoq4g" data-title="Perfect - Ed Sheeran">
              <div class="track-info">
                <span class="track-num">02</span>
                <span class="track-title">Perfect</span>
                <span class="track-artist">Ed Sheeran</span>
              </div>
              <button class="play-btn">▶</button>
            </div>

            <div class="playing-status" id="playing-status">Select a song...</div>
          </div>

          <!-- STICKY NOTE -->
          <div class="sticky-note">
            <p class="note-greeting">Hey you,</p>
            <p class="note-body">I made you a mixtape — the cassette kind, not a CD player. Side A is us laughing. Side B is me missing you already.</p>
            <p class="note-footer">Press play.</p>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- HTML5 AUDIO ELEMENT -->
  <audio id="audio-player"></audio>

  <script src="script.js"></script>
</body>
</html>
